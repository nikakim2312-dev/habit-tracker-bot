name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev
      - run: node --check bot-v2.js
      - run: cp bot-v2.js test-bot.js && DATA_FILE=test-data.json BOT_TOKEN=TEST LOG_LEVEL=critical NODE_ENV=test node test-onboard.cjs
      - run: rm -f test-data.json test-bot.js
